name: Fostering Cellular Agriculture CI

on:
  push:
    paths:
      - "projects/fostering-cellular-agriculture/**"
      - ".github/workflows/fostering-cellular-agriculture-ci.yml"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths:
      - "projects/fostering-cellular-agriculture/**"
      - ".github/workflows/fostering-cellular-agriculture-ci.yml"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Facility finance / ${{ matrix.toolchain.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.toolchain.os }}
    defaults:
      run:
        working-directory: projects/fostering-cellular-agriculture
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        toolchain:
          - name: GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: MSVC
            os: windows-latest
            cc: ""
            cxx: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.toolchain.cc }}
          CXX: ${{ matrix.toolchain.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DNATURALEHIA_CELLULAR_FINANCE_WARNINGS_AS_ERRORS=ON

      - name: Configure
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DNATURALEHIA_CELLULAR_FINANCE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: >-
          ctest --test-dir build -C ${{ matrix.build_type }}
          --output-on-failure
