# SYNTHETIC STRESS FIXTURE. These values are deliberately adverse and are not
# a forecast, rating case, or empirical estimate.
# Monetary inputs use one unspecified demonstration currency. They are not
# represented as either real or nominal market observations.

scenario.model_version=0.1.0
scenario.label=Illustrative adverse facility stress
scenario.source_note=Invented stress inputs for testing tail behavior and capped risk transfer; not calibrated to real evidence
scenario.currency_label=DEMO
scenario.monetary_basis=unspecified-synthetic
scenario.synthetic_inputs=true
simulation.trials=10000
simulation.seed=20260827

facility.analysis_years=12
facility.planned_construction_years=2.5
facility.base_capex_million=300.0
facility.annual_nameplate_output_million_kg=8.0
facility.steady_state_utilization=0.60
facility.ramp_at_commercial_operation=0.30
facility.annual_ramp_increment=0.20
facility.base_spot_price_per_kg=12.0
facility.base_variable_cost_per_kg=10.5
facility.base_fixed_opex_million=15.0
facility.project_discount_rate=0.15

risk.capex_log_sigma=0.35
risk.construction_duration_log_sigma=0.30
risk.utilization_logit_sigma=0.50
risk.biological_yield_log_sigma=0.25
risk.output_price_log_sigma=0.25
risk.variable_cost_log_sigma=0.25
risk.fixed_opex_log_sigma=0.18
risk.annual_contamination_probability=0.15
risk.contamination_logit_sigma=1.00
risk.contamination_output_loss_fraction=0.50
risk.persistent_factor_loading=0.60

debt.debt_fraction_of_base_capex=0.25
debt.annual_interest_rate=0.12
debt.tenor_years=7
debt.recovery_fraction_after_default=0.20
debt.assume_terminal_balance_paid_by_sponsor=true

instrument.offtake_fraction=0.40
instrument.offtake_price_per_kg=14.0
instrument.price_support_kind=one-way-floor
instrument.price_support_fraction=0.30
instrument.price_support_strike_per_kg=12.5
instrument.price_support_annual_cap_million=10.0
instrument.price_support_lifetime_cap_million=35.0
instrument.completion_delay_trigger_years=3.0
instrument.completion_payout_per_delay_year_million=10.0
instrument.completion_delay_cover_cap_million=15.0
instrument.upfront_fee_million=5.0
