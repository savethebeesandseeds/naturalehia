# SYNTHETIC FULLY FUNDED TWO-CLAIM TEMPLATE ONLY.
# The all-at-par project rows are deliberately passed through the v0.2
# asset/liability bridge so issued-principal risk is Q, never a legacy loss
# placeholder. This is not a price, rating, offer, or evidence of demand.

capital_stack.model_version=0.2.0
capital_stack.label=Ten-claim v0.2 junior and market issued-principal template
