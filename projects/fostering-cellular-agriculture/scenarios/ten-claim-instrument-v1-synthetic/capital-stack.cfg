# SYNTHETIC FULLY FUNDED TWO-CLASS TERMS ONLY.
# The same unchanged pool is allocated between funded first loss and a market
# priority claim. This is not a price, rating, legal form, or proof of demand.

capital_stack.model_version=0.1.0
capital_stack.label=Ten-claim funded first-loss and market-priority variant
capital_stack.source_note=Invented at-par two-class waterfall for transparent loss and cash-allocation mechanics only
capital_stack.synthetic_inputs=true
capital_stack.aggregate_commitment_is_fully_funded_at_par_at_month_zero=true
capital_stack.subscription_reserve_is_zero_yield_and_lossless=true
capital_stack.undrawn_commitment_cancels_and_returns_only_at_horizon=true
capital_stack.pool_costs_are_additional_pro_rata_calls=true
capital_stack.principal_cash_is_paid_most_senior_first=true
capital_stack.nonprincipal_cash_is_paid_to_caps_then_residual=true
capital_stack.tranching_does_not_change_project_cash_or_gross_loss=true
capital_stack.premium_discount_or_fair_value_is_claimed=false
capital_stack.underlying_success_participation_fraction=1

tranche.count=2
tranche.1.id=funded-first-loss-participation
tranche.1.attachment_million=0
tranche.1.detachment_million=20
tranche.1.priority_nonprincipal_cap_million=0
tranche.1.annual_physical_hurdle_rate=0.15
tranche.1.is_first_loss_residual=true
tranche.2.id=market-priority-claim
tranche.2.attachment_million=20
tranche.2.detachment_million=100
tranche.2.priority_nonprincipal_cap_million=24
tranche.2.annual_physical_hurdle_rate=0.08
tranche.2.is_first_loss_residual=false
