# SYNTHETIC CAPITAL-STACK TERMS ONLY.
# The terms exist solely to verify cash conservation, priority, loss, exposure,
# and robust physical-scenario calculations. They are not a fair value, market
# quote, spread, rating, legal form, offer, or investment recommendation.

capital_stack.model_version=0.1.0
capital_stack.label=Two-project fully funded synthetic capital stack
capital_stack.source_note=Invented at-par priority terms for hand-calculated mechanics testing only
capital_stack.synthetic_inputs=true
capital_stack.aggregate_commitment_is_fully_funded_at_par_at_month_zero=true
capital_stack.subscription_reserve_is_zero_yield_and_lossless=true
capital_stack.undrawn_commitment_cancels_and_returns_only_at_horizon=true
capital_stack.pool_costs_are_additional_pro_rata_calls=true
capital_stack.principal_cash_is_paid_most_senior_first=true
capital_stack.nonprincipal_cash_is_paid_to_caps_then_residual=true
capital_stack.tranching_does_not_change_project_cash_or_gross_loss=true
capital_stack.premium_discount_or_fair_value_is_claimed=false
capital_stack.underlying_success_participation_fraction=1

# Loss attaches from first-loss upward. Principal and capped non-principal cash
# pay in the reverse order: senior, intermediate, then residual.
tranche.count=3

tranche.1.id=first-loss-residual
tranche.1.attachment_million=0
tranche.1.detachment_million=4
tranche.1.priority_nonprincipal_cap_million=0
tranche.1.annual_physical_hurdle_rate=0
tranche.1.is_first_loss_residual=true

tranche.2.id=intermediate
tranche.2.attachment_million=4
tranche.2.detachment_million=10
tranche.2.priority_nonprincipal_cap_million=2
tranche.2.annual_physical_hurdle_rate=0
tranche.2.is_first_loss_residual=false

tranche.3.id=senior
tranche.3.attachment_million=10
tranche.3.detachment_million=20
tranche.3.priority_nonprincipal_cap_million=1
tranche.3.annual_physical_hurdle_rate=0
tranche.3.is_first_loss_residual=false
