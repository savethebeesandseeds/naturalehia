# SYNTHETIC COUNTERPARTY-CREDIT STRESS DATA ONLY.
# These fixed conditional physical probabilities and recovery assumptions are
# invented for transparent hand reconciliation. They are not a provider
# rating, a market-implied default model, CVA, fair value, a legal opinion, a
# collateral-control agreement, a quote, or evidence of commercial terms.

provider_credit.model_version=0.1.0
provider_credit.label=Two-project provider counterparty-credit synthetic stress
provider_credit.source_note=Unvalidated synthetic physical-P provider performance states for hand reconciliation only
provider_credit.provider_id=synthetic-catalytic-provider
provider_credit.synthetic_inputs=true

# Closed accounting and interpretation assertions. The provider's robust
# all-performance price is not repriced or reduced when provider default is
# introduced. The price-ladder collateral base is treated as pledged here only
# because this input says so; the earlier pricing model did not prove a pledge.
provider_credit.gross_contractual_claim_remains_unchanged=true
provider_credit.provider_price_remains_full_performance_and_unchanged=true
provider_credit.conditional_provider_state_weights_are_fixed_physical=true
provider_credit.price_ladder_collateral_is_pledged_to_investor=true
provider_credit.collateral_yield_remains_in_pledged_account=true
provider_credit.collateral_applies_before_unsecured_recovery=true
provider_credit.provider_default_occurs_at_claim_settlement=true
provider_credit.provider_default_is_physical_stress_not_pricing_measure=true
provider_credit.legal_enforceability_is_validated=false
provider_credit.market_cva_or_fair_value_is_claimed=false

# Each original portfolio scenario has a complete fixed conditional provider
# state distribution. These conditional weights are not independently varied
# inside the portfolio probability envelope. Higher conditional default
# probability in loss scenarios creates the deliberately wrong-way fixture.
provider_credit.scenario.count=4

provider_credit.scenario.1.id=common-success
provider_credit.scenario.1.state.count=2
provider_credit.scenario.1.state.1.id=performs
provider_credit.scenario.1.state.1.conditional_weight=0.99
provider_credit.scenario.1.state.1.provider_performs=true
provider_credit.scenario.1.state.1.collateral_realization_fraction=0
provider_credit.scenario.1.state.1.unsecured_recovery_fraction=0
provider_credit.scenario.1.state.1.unsecured_recovery_delay_months=0
provider_credit.scenario.1.state.2.id=defaults
provider_credit.scenario.1.state.2.conditional_weight=0.01
provider_credit.scenario.1.state.2.provider_performs=false
provider_credit.scenario.1.state.2.collateral_realization_fraction=0.75
provider_credit.scenario.1.state.2.unsecured_recovery_fraction=0.25
provider_credit.scenario.1.state.2.unsecured_recovery_delay_months=6

