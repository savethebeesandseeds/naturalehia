# Synthetic only. These inputs test provider price-ladder mechanics; they are
# not a quote, a provider balance sheet, a regulatory-capital calculation, or
# evidence that these costs or terms are commercially obtainable.
provider_price.model_version=0.1.0
provider_price.label=Two-project provider price-ladder synthetic sensitivity
provider_price.source_note=Unvalidated synthetic incremental provider cost allowances for hand reconciliation only
provider_price.synthetic_inputs=true

# Select the loss-protection solver's certified investor-target-passing upper
# endpoint. No maximum-coverage fallback is permitted if that point is absent.
provider_price.coverage_selection=reported-investor-target-passing
provider_price.explicit_coverage_fraction=none

# Closed accounting assertions for this narrow v0.1 sensitivity.
provider_price.cost_bases_use_contractual_maximum_exposure=true
provider_price.collateral_and_capital_are_held_until_settlement=true
provider_price.variable_claim_expense_is_paid_at_claim_settlement=true
provider_price.fixed_expense_and_target_profit_are_month_zero_values=true
provider_price.incremental_cost_terms_are_separate_and_nonduplicative=true

# Both bases are independently disclosed fractions of contractual maximum
# exposure. The capital charge is an incremental pricing allowance; capital
# stock is not a premium expense and this does not establish capital adequacy.
provider_price.collateral_fraction_of_contractual_maximum_exposure=0.5
provider_price.collateral_annual_effective_funding_rate=0.06
provider_price.collateral_annual_effective_yield_rate=0.02
provider_price.risk_capital_fraction_of_contractual_maximum_exposure=0.3
provider_price.risk_capital_annual_effective_charge_rate=0.1

# Fixed expense and target profit are month-zero amounts in DEMO million.
# Variable claim expense is a fraction of each terminal claim PV.
provider_price.fixed_expense_upfront_million=0.05
provider_price.variable_claim_expense_fraction=0.1
provider_price.target_profit_upfront_million=0.1

# Deliberate engine boundary.
provider_price.provider_default_risk_is_modeled=false
provider_price.fair_value_is_claimed=false
